<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Outline and Focus Styling</h1>
  </header>

  <main>
    <form class="contact-form">

      <label for="name">Name</label>
      <input type="text" id="name" class="outline-solid" placeholder="Enter your name">

      <label for="email">Email</label>
      <input type="text" id="email" class="outline-dashed" placeholder="Enter your email">

      <label for="message">Message</label>
      <textarea id="message" class="outline-dotted" placeholder="Type your message" rows="4"></textarea>

      <button type="button">Submit</button>

    </form>
  </main>

  <footer>
    <p>Assignment 7 - Question 9</p>
  </footer>

</body>
</html>
