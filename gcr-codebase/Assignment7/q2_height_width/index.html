<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Height and Width Practice Layout</h1>
  </header>

  <main class="box-container">

    <div class="box box-px">
      <p>Width: 200px<br>Height: 150px</p>
    </div>

    <div class="box box-percent">
      <p>Width: 50%<br>Height: 30vh</p>
    </div>

    <div class="box box-em">
      <p>This box uses em units. It also uses min-height, max-width,
      and overflow so extra text scrolls instead of breaking the layout.
      Adding more text here to prove overflow works.</p>
    </div>

  </main>

  <footer>
    <p>Assignment 7 - Question 2</p>
  </footer>

</body>
</html>
