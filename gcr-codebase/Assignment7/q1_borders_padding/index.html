<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Borders and Padding Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Borders and Padding Demonstration</h1>
  </header>

  <main>
    <section class="box-row">

      <div class="box solid-box">
        <p>Solid Border</p>
      </div>

      <div class="box dashed-box">
        <p>Dashed Border</p>
      </div>

      <div class="box double-box">
        <p>Double Border</p>
      </div>

      <div class="box groove-box">
        <p>Groove Border</p>
      </div>

      <div class="box rounded-box">
        <p>Rounded Corners</p>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 7 - Question 1</p>
  </footer>

</body>
</html>
