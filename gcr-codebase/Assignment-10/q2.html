<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alex Morgan | Product Designer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">
    <header class="container text-center py-5">
        <p class="text-uppercase text-secondary small mb-2">Hello, I am</p>
        <h1 class="fw-bold">Alex Morgan</h1>
        <p class="lead mb-0">Product designer turning complex ideas into clear experiences.</p>
    </header>
    <main class="container text-center">
        <section class="bg-white rounded-4 shadow-sm p-5"><img
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400"
                class="img-fluid rounded-circle profile-image mb-4" alt="Alex Morgan smiling">
            <h2 class="h3 fw-bold">Design with purpose</h2>
            <p class="text-secondary mx-auto profile-copy">I partner with thoughtful teams to make products more useful,
                accessible, and distinctly human.</p>
            <div class="d-flex justify-content-center flex-wrap gap-3 mt-4 mb-3"><a class="btn btn-dark px-4"
                    href="#contact">Hire Me</a><a class="btn btn-outline-dark px-4" href="#">Download CV</a></div>
        </section>
        <section id="contact" class="py-5">
            <h2 class="h4 fw-bold mb-3">Let’s work together</h2>
            <form class="mx-auto contact-form text-start"><label class="form-label" for="email">Email
                    address</label><input class="form-control mb-3" id="email" type="email"
                    placeholder="you@example.com"><label class="form-label" for="message">Project note</label><textarea
                    class="form-control mb-3" id="message" rows="3"
                    placeholder="Tell me a little about your project"></textarea><button class="btn btn-dark w-100"
                    type="submit">Send message</button></form>
        </section>
    </main>
    <footer class="border-top text-center py-4"><small class="text-secondary">© 2025 Alex Morgan · Available for select
            projects</small></footer>
</body>

</html>
