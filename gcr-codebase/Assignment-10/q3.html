<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hearth & Home | Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>

<body>
    <header class="border-bottom">
        <nav class="navbar container py-3"><a class="navbar-brand fw-bold" href="#">Hearth <span
                    class="text-danger">&</span> Home</a><span class="text-secondary small">Objects for slower
                living</span></nav>
    </header>
    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4">
            <div>
                <p class="text-danger text-uppercase small fw-bold mb-2">Spring collection</p>
                <h1 class="fw-bold mb-0">Made for the everyday</h1>
            </div>
            <p class="text-secondary mb-0 mt-3 mt-md-0">Curated pieces with a lasting point of view.</p>
        </div>
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 border-0 shadow-sm"><img
                        src="https://images.unsplash.com/photo-1618220179428-22790b461013?w=600" class="card-img-top"
                        alt="Ceramic vase">
                    <div class="card-body">
                        <h2 class="h5">Arc Ceramic Vase</h2>
                        <p class="text-secondary">₹1,850</p><button class="btn btn-outline-dark w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 border-0 shadow-sm"><img
                        src="https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=600" class="card-img-top"
                        alt="Table lamp">
                    <div class="card-body">
                        <h2 class="h5">Dawn Table Lamp</h2>
                        <p class="text-secondary">₹3,200</p><button class="btn btn-outline-dark w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 border-0 shadow-sm"><img
                        src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=600" class="card-img-top"
                        alt="Lounge chair">
                    <div class="card-body">
                        <h2 class="h5">Moss Lounge Chair</h2>
                        <p class="text-secondary">₹12,400</p><button class="btn btn-outline-dark w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 border-0 shadow-sm"><img
                        src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600" class="card-img-top"
                        alt="Wall clock">
                    <div class="card-body">
                        <h2 class="h5">Quiet Wall Clock</h2>
                        <p class="text-secondary">₹2,750</p><button class="btn btn-outline-dark w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-4"><small>Hearth & Home · Crafted for home</small></footer>
</body>

</html>
