<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daymark | Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7.css">
</head>

<body>
    <header class="bg-dark text-white">
        <nav class="container navbar py-3"><a class="navbar-brand text-white fw-bold" href="#">Daymark</a><span
                class="badge text-bg-warning rounded-pill">5 pending</span></nav>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <p class="text-uppercase small fw-bold text-primary mb-1">Tuesday focus</p>
                    <h1 class="fw-bold">Keep the day moving.</h1>
                    <p class="text-secondary">A short list is a kind list.</p>
                </div>
                <div class="list-group shadow-sm">
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Review
                            product brief</span><span class="badge text-bg-danger rounded-pill">High</span></div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Send
                            client notes</span><span class="badge text-bg-warning rounded-pill">Medium</span></div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Refill
                            studio supplies</span><span class="badge text-bg-success rounded-pill">Low</span></div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Book
                            Friday review</span><span class="badge text-bg-warning rounded-pill">Medium</span></div>
                </div><button class="btn btn-primary mt-4">Completed <span
                        class="badge text-bg-light text-dark ms-1">8</span></button>
            </div>
        </div>
    </main>
    <footer class="container border-top py-4 text-secondary small">Daymark · Make space for meaningful work.</footer>
</body>

</html>
