<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Simple UI Components</h1></header>
  <main class="card">
    <label for="search">Search products</label>
    <input id="search" type="search" placeholder="Type here...">
    <label for="category">Choose a category</label>
    <select id="category"><option>Books</option><option>Music</option><option>Games</option></select>
    <div class="actions"><button>Search</button><button class="clear">Clear</button></div>
  </main>
  <footer><p>Assignment 8 - Question 7</p></footer>
</body>
</html>
