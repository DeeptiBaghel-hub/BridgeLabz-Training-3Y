<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltips</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Tooltip Demonstration</h1></header>
  <main class="tooltip-row">
    <section class="tip-box"><span class="icon">?</span><span class="tooltip">Help information</span><p>Help</p></section>
    <section class="tip-box"><span class="icon">!</span><span class="tooltip">Important message</span><p>Warning</p></section>
    <section class="tip-box"><span class="icon">i</span><span class="tooltip">More details here</span><p>Info</p></section>
  </main>
  <footer><p>Assignment 8 - Question 2</p></footer>
</body>
</html>
