<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Pseudo-Classes</h1></header>
  <main class="examples">
    <section class="example"><a href="#">Hover over this link</a><p><strong>:hover</strong> changes the link color.</p></section>
    <section class="example"><button>Click this button</button><p><strong>:active</strong> changes the button while clicking.</p></section>
    <section class="example"><input type="text" placeholder="Focus here"><p><strong>:focus</strong> adds a border to the input.</p></section>
    <section class="example"><ul><li>First item</li><li>Second item</li><li>Third item</li></ul><p><strong>:nth-child()</strong> selects an item by its position.</p></section>
  </main>
  <footer><p>Assignment 8 - Question 1</p></footer>
</body>
</html>
