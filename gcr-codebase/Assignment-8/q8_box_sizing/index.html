<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Box-Sizing Comparison</h1></header>
  <main class="comparison">
    <section class="box default-box"><h2>Default Box</h2><p>content-box</p><p>The width is only for content. Padding and border make the total box wider.</p></section>
    <section class="box border-box"><h2>Border Box</h2><p>border-box</p><p>The width includes content, padding, and border, so the total size stays fixed.</p></section>
  </main>
  <footer><p>Both boxes have a width of 300px and padding of 25px.</p></footer>
</body>
</html>
