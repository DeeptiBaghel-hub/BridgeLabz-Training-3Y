<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <main>
        <h1>Image Filter Gallery</h1>

        <section class="gallery">
            <figure>
                <img class="blur" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600" alt="Nature">
                <figcaption>Blur Effect</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Mountain">
                <figcaption>Grayscale Effect</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake">
                <figcaption>Sepia Effect</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600" alt="Forest">
                <figcaption>Brightness Effect</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Landscape">
                <figcaption>Contrast Effect</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Trees">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>
        </section>
    </main>

</body>
</html>
