<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main>
        <h1>Filter Comparison</h1>

        <section class="comparison">

            <figure>
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Original Image">
                <figcaption>Original Image</figcaption>
            </figure>

            <figure>
                <img class="filtered" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Filtered Image">
                <figcaption>Filtered Image</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
