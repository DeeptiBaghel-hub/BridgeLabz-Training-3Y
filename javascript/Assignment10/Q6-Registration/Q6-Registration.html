<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q6-Registration</title><style>body{font:16px Arial;max-width:850px;margin:32px auto;padding:20px;background:#f4f7fb;color:#263348}main{background:white;padding:26px;border-radius:12px}article,li{padding:14px;margin:10px 0;border:1px solid #d4dce8;border-radius:8px}button{padding:9px 14px;margin:8px;cursor:pointer;background:#315fce;color:white;border:0;border-radius:5px}input,select{padding:9px;margin:8px;border:1px solid #aab6c8;border-radius:5px}img{width:120px;height:90px;object-fit:cover;display:block}.active{color:green}.inactive{color:#bd3434}#dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.count{font-size:2rem;font-weight:bold;color:#315fce}</style></head><body><main><h1>Q6 Registration</h1><form id="register"><label>Name <input id="name" required></label><label>Email <input id="email" type="email" required></label><label>Password <input id="password" type="password" minlength="8" required></label><button type="submit">Register</button></form><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script src="Q6-Registration.js"></script></body></html>
