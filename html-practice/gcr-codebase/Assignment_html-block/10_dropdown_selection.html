<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <header>
        <h1>Travel Preferences</h1>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Country dropdown with a pre-selected option -->
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="usa">USA</option>
                <option value="india" selected>India</option>
                <option value="japan">Japan</option>
            </select>
            <br><br>

            <!-- State dropdown with a pre-selected option -->
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="delhi">Delhi</option>
                <option value="up" selected>Uttar Pradesh</option>
                <option value="maharashtra">Maharashtra</option>
            </select>
            <br><br>

            <!-- City dropdown with a pre-selected option -->
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="lucknow">Lucknow</option>
                <option value="agra" selected>Agra</option>
                <option value="mathura">Mathura</option>
            </select>
            <br><br>

            <!-- Favorite Tourist Place dropdown with a pre-selected option -->
            <label for="place">Favorite Tourist Place:</label>
            <select id="place" name="place">
                <option value="tajmahal" selected>Taj Mahal</option>
                <option value="redfort">Red Fort</option>
                <option value="qutubminar">Qutub Minar</option>
            </select>

        </form>

        <!-- Summary paragraph -->
        <p>
            Based on the selections above, the default choice is: India, Uttar Pradesh,
            Agra, and the favorite tourist place is the Taj Mahal.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Travel Preferences Page.</p>
    </footer>

</body>
</html>
