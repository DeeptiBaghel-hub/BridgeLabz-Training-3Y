<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="q8-photo-gallery.css">
</head>
<body>
<main class="gallery">
  <figure>
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500&h=400&fit=crop" alt="Mountain landscape">
    <figcaption>Mountain ridge at dawn</figcaption>
  </figure>
  <figure>
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&h=400&fit=crop" alt="Forest path">
    <figcaption>Forest trail in autumn</figcaption>
  </figure>
  <figure>
    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500&h=400&fit=crop" alt="Desert dunes">
    <figcaption>Dunes at sunset</figcaption>
  </figure>
  <figure>
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&h=400&fit=crop" alt="Beach shoreline">
    <figcaption>Quiet shoreline</figcaption>
  </figure>
  <figure>
    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&h=400&fit=crop" alt="Lake reflection">
    <figcaption>Still lake reflection</figcaption>
  </figure>
  <figure>
    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500&h=400&fit=crop" alt="City skyline">
    <figcaption>City skyline at night</figcaption>
  </figure>
</main>
</body>
</html>
