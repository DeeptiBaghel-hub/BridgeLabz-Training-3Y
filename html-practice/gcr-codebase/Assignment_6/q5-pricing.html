<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing</title>
<link rel="stylesheet" href="q5-pricing.css">
</head>
<body>
<main class="pricing">
  <div class="plan">
    <h2>Starter</h2>
    <p class="cost">$9<span>/mo</span></p>
    <ul>
      <li>1 project</li>
      <li>Basic support</li>
      <li>1 GB storage</li>
    </ul>
  </div>

  <div class="plan featured">
    <h2>Pro</h2>
    <p class="cost">$29<span>/mo</span></p>
    <ul>
      <li>Unlimited projects</li>
      <li>Priority support</li>
      <li>50 GB storage</li>
    </ul>
  </div>

  <div class="plan">
    <h2>Team</h2>
    <p class="cost">$79<span>/mo</span></p>
    <ul>
      <li>Everything in Pro</li>
      <li>5 team seats</li>
      <li>200 GB storage</li>
    </ul>
  </div>
</main>
</body>
</html>
