<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="q1-borders.css">
</head>
<body>
  <header><h1>Borders and Padding</h1><p>Hover over each box to change its border.</p></header>
  <main class="box-row">
    <section class="demo solid"><h2>Solid</h2><p>Comfortable padding inside.</p></section>
    <section class="demo dashed"><h2>Dashed</h2><p>Tighter internal spacing.</p></section>
    <section class="demo double"><h2>Double</h2><p>Extra room around content.</p></section>
    <section class="demo groove"><h2>Groove</h2><p>Rounded corners and depth.</p></section>
  </main>
  <footer><p>Four border styles, four padding examples.</p></footer>
</body>
</html>
