<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - File Upload Form</title>
</head>
<body>
    <!-- Q9: File Upload Form restricted to .jpg and .png files -->
    <h1>File Upload Form</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="fileupload">Choose an image to upload:</label><br>
        <input type="file" id="fileupload" name="fileupload" accept=".jpg,.png"><br><br>
        <input type="submit" value="Upload">
    </form>

    <p>Note: Only .jpg and .png image files are allowed to be uploaded through this form.</p>
</body>
</html>
