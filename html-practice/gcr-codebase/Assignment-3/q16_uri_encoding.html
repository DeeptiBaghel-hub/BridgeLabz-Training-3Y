<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q16 - URI Encoding</title>
</head>
<body>
    <!-- Q16: Demonstrating URI encoding of special characters (space encoded as %20) -->
    <h1>URI Encoding Demonstration</h1>

    <p>Original URL: https://example.com/search?query=HTML &amp; CSS</p>

    <p>
        Correctly Encoded Link:
        <a href="https://example.com/search?query=HTML%20&%20CSS">
            https://example.com/search?query=HTML%20&amp;%20CSS
        </a>
    </p>

    <p>Note: The space character in the URL is encoded as %20.</p>
</body>
</html>
