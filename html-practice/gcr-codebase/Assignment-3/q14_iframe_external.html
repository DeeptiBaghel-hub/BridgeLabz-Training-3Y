<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q14 - External Website Embed</title>
</head>
<body>
    <!-- Q14: Embedding an external website using an iframe -->
    <h1>Embedding Wikipedia</h1>
    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia Website"
        width="700"
        height="450">
    </iframe>

    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
