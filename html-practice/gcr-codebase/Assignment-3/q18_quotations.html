<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q18 - Quotations</title>
</head>
<body>
    <!-- Q18: Long quotation using blockquote and short quotation using q, with an HTML entity -->
    <h1>Quotations Example</h1>

    <blockquote>
        The only way to do great work is to love what you do, and true success
        comes when knowledge &amp; passion work together.
    </blockquote>

    <p>
        As my teacher always says, <q>practice makes a person perfect</q>,
        and I try to remember this every day.
    </p>
</body>
</html>
