<head>
    <!-- title: sets the text shown in the browser tab and search engine results -->
    <title>Q20 - Important Head Elements</title>

    <!-- meta charset: defines the character encoding used by the page -->
    <meta charset="UTF-8">

    <!-- meta description: gives a short summary of the page for search engines -->
    <meta name="description" content="A page demonstrating important elements used inside the HTML head section.">

    <!-- meta author: specifies the author of the webpage -->
    <meta name="author" content="Deepti Baghel">

    <!-- base: sets the default base URL for all relative links on the page -->
    <base href="https://example.com/">

    <!-- link: connects an external resource, here a favicon icon, to the page -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- style: reserved for internal CSS rules (left empty as per instructions) -->
    <style>
    </style>

    <!-- script: reserved for internal JavaScript code (left empty as per instructions) -->
    <script>
    </script>
</head>
<body>
    <h1>Important Head Elements Demonstration</h1>
    <p>This page shows the essential elements used within the HTML head section, explained with comments above.</p>

</html>
