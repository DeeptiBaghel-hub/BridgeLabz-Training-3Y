<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Login Form</title>
</head>
<body>
    <!-- Q7: Login Form with a hidden CSRF token field -->
    <h1>Login Form</h1>
    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <!--
            A CSRF (Cross-Site Request Forgery) token is a hidden, unique value
            generated by the server and included in the form. When the form is
            submitted, the server checks that this token matches the one it issued.
            This helps prevent attackers from tricking a logged-in user's browser
            into submitting unauthorized requests on their behalf.
        -->
        <input type="hidden" name="csrf_token" value="dummyCSRFToken12345">

        <input type="submit" value="Login">
    </form>
</body>
</html>
