<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q19 - Form Security Attributes</title>
</head>
<body>
    <!-- Q19: Demonstrating form security attributes: autocomplete="off" and required fields -->
    <h1>Secure Login Form</h1>

    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>

    <p>
        Turning off autocomplete can improve security because it prevents the
        browser from storing and auto-filling sensitive information such as
        passwords, especially on shared or public computers where saved data
        could be accessed by someone else.
    </p>
</body>
</html>
