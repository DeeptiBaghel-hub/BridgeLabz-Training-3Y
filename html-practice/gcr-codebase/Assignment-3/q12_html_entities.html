<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q12 - HTML Entities</title>
</head>
<body>
    <!-- Q12: Displaying reserved characters and symbols using HTML entities -->
    <h1>HTML Entities Demonstration</h1>
    <p>
        Less than: &lt; &nbsp;&nbsp;
        Greater than: &gt; &nbsp;&nbsp;
        Ampersand: &amp; &nbsp;&nbsp;
        Double Quote: &quot; &nbsp;&nbsp;
        Single Quote: &apos;
    </p>
    <p>
        Copyright: &copy; &nbsp;&nbsp;
        Trademark: &trade; &nbsp;&nbsp;
        Registered: &reg;
    </p>
</body>
</html>
