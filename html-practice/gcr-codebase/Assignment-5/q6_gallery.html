<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<link rel="stylesheet" href="q6_gallery.css">
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
  </header>

  <main class="gallery">
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
      <figcaption class="caption">Mountain Range</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=Ocean" alt="Ocean">
      <figcaption class="caption">Coastal View</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
      <figcaption class="caption">Forest Trail</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
      <figcaption class="caption">Desert Dunes</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=City" alt="City">
      <figcaption class="caption">City Skyline</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300?text=Lake" alt="Lake">
      <figcaption class="caption">Quiet Lake</figcaption>
    </figure>
  </main>
</body>
</html>
